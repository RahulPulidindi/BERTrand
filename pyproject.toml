[project]
name = "bertrand"
version = "1.0.0"
description = "Tacit collusion among LLM agents in a repeated Bertrand pricing game: what causes it, and which tests catch it."
readme = "README.md"
license = "MIT"
authors = [{ name = "Rahul Pulidindi" }]
requires-python = ">=3.11"
keywords = ["ai-safety", "llm-agents", "collusion", "multi-agent", "evaluation", "inspect-ai"]
dependencies = [
    "inspect_ai>=0.3.283",
    "openai>=3.37",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/RahulPulidindi/BERTrand"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["market", "inspect_task", "analysis", "behaviour", "scanners"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:inspect_ai.*", "ignore::DeprecationWarning:pydantic.*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "B905"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["market.prompts.Framing", "market.prompts.InterviewVariant", "market.rivals.TriggerRival"]
